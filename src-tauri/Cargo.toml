[package]
name = "duplifind"
version = "0.1.0"
description = "Cross-platform duplicate file finder"
authors = ["DupliFind Team"]
edition = "2021"
license = "MIT"

[lib]
name = "duplifind_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "duplifind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

# Async runtime
futures = "0.3"

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# File system operations
walkdir = "2.5"

# Time handling

# Parallel processing
rayon = "1.10"
num_cpus = "1.16"

# Channel for async communication
crossbeam-channel = "0.5"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3.14"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
