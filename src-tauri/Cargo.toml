[package]
name = "duplifind"
version = "0.1.0"
description = "Cross-platform duplicate file finder"
authors = ["DupliFind Team"]
edition = "2021"
license = "MIT"

[lib]
name = "duplifind_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "duplifind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
